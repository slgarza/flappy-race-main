# Godot custom build Gradle settings.
# These properties apply when running custom build from the Godot editor.
# NOTE: This should be kept in sync with 'godot/platform/android/java/gradle.properties' except
# where otherwise specified.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

android.enableJetifier=true
android.useAndroidX=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4536m
org.gradle.java.home=/home/sergiolozano/.local/jdks/jdk-17.0.19+10

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

org.gradle.warning.mode=all

# Enable resource optimizations for release build.
# NOTE: This is turned off for template release build in order to support the build legacy process.
android.enableResourceOptimizations=true

# Fix gradle build errors when the build path contains non-ASCII characters
android.overridePathCheck=true

# Flappy Race Android Studio defaults.
export_package_name=com.slgdeveloper.flappyrace
export_version_code=201
export_version_name=0.20.1
export_version_min_sdk=23
export_version_target_sdk=36
export_enabled_abis=arm64-v8a|
godot_editor_version=3.6.2.stable
debug_keystore_file=/home/sergiolozano/.android/debug.keystore
debug_keystore_password=android
debug_keystore_alias=androiddebugkey

# Release signing. Passwords are intentionally not stored in this file.
# Use tools/build_android_release_documents_keystore.sh or Android Studio's
# Generate Signed Bundle / APK flow with this keystore.
perform_signing=true
release_keystore_file=/home/sergiolozano/Documents/Keystore.jks
release_keystore_alias=key0
